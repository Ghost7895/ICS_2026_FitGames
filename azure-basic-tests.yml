# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: windows-latest

steps:
- task: UseDotNet@2
  displayName: Install .NET SDK
  inputs:
    packageType: 'sdk'
    version: '10.0.x'

- script: dotnet workload restore FitGames/FitGames.slnx
  displayName: 'Install .NET Workloads'

- script: dotnet restore FitGames/FitGames.slnx
  displayName: Restore dependencies

- script: dotnet test FitGames/FitGames.DAL.Tests/FitGames.DAL.Tests.csproj --configuration Release --no-restore
  displayName: Run DAL tests

- script: dotnet test FitGames/FitGames.BL.Tests/FitGames.BL.Tests.csproj --configuration Release --no-restore
  displayName: Run BL tests